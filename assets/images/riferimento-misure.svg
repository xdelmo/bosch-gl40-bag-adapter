xt-anchor="middle" x="430" y="313">E: U_DEPTH</text><path d="m210 240v-55" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m255 240v-55" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m218 195h29" marker-end="url(#a)" marker-start="url(#b)" stroke="#0284c7" stroke-width="2"/><rect fill="#0284c7" height="24" rx="4" width="75" x="195" y="157"/><text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="232" y="174">F: TAB_W</text><path d="m255 240h30" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m255 270h30" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m275 246v18" marker-end="url(#a)" marker-start="url(#b)" stroke="#0284c7" stroke-width="1.8"/><rect fill="#0284c7" height="22" rx="4" width="75" x="236" y="278"/><text fill="#fff" font-size="11" font-weight="700" text-anchor="middle" x="273" y="294">G: TAB_H</text><path d="m190 270v-55" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m210 250v-35" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m193 225h14" marker-end="url(#a)" marker-start="url(#b)" stroke="#0284c7" stroke-width="1.6"/><rect fill="#0284c7" height="22" rx="4" width="46" x="142" y="225"/><text fill="#fff" font-size="11" font-weight="700" text-anchor="middle" x="165" y="241">H</text><path d="m392 428 83-83" marker-start="url(#b)" stroke="#0284c7" stroke-width="2"/><rect fill="#0284c7" height="24" rx="4" width="98" x="475" y="333"/><text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="524" y="350">Ø K: HOLE_D</text><path d="m404 524 76 76" marker-start="url(#e)" stroke="#7c3aed" stroke-dasharray="3 2" stroke-width="1.8"/><rect fill="#7c3aed" height="24" rx="4" width="128" x="475" y="590"/><text fill="#fff" font-size="11.5" font-weight="700" text-anchor="middle" x="539" y="607">Ø T: MEMBRANE_OD</text><path d="m312 508-62 132" marker-start="url(#b)" stroke="#d97706" stroke-dasharray="3 2" stroke-width="1.8"/><rect fill="#d97706" height="24" rx="4" width="102" x="200" y="640"/><text fill="#fff" font-size="11.5" font-weight="700" text-anchor="middle" x="251" y="657">Ø N: INLET_D</text><path d="m190 630v135" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m350 630v135" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m198 755h144" marker-end="url(#a)" marker-start="url(#b)" stroke="#0284c7" stroke-width="2"/><rect fill="#0284c7" height="24" rx="4" width="130" x="205" y="742"/><text fill="#fff" font-size="11" font-weight="700" text-anchor="middle" x="270" y="759">L: HOLE_X_FROM_LEFT</text><path d="m497 630h78" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m410 470h165" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m565 622v-144" marker-end="url(#a)" marker-start="url(#b)" stroke="#0284c7" stroke-width="2"/><rect fill="#0284c7" height="24" rx="4" width="130" x="500" y="538"/><text fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle" x="565" y="555">M: HOLE_Y_BOTTOM</text><rect fill="#f1f5f9" height="64" rx="6" stroke="#cbd5e1" width="638" x="36" y="820"/><text fill="#0f172a" font-size="12" font-weight="700" x="48" y="842">Riferimento Coordinate (da CLAUDE.md):</text><text fill="#475569" font-size="11.5" x="48" y="860">• Origine (0,0) esattamente al centro del foro di aspirazione K. Piastra centrata o scostata secondo L e M.</text><text fill="#475569" font-size="11.5" x="48" y="874">• Le quote Q (keep-outs di clip e fermi) vanno espresse come [x0, y0, x1, y1] rispetto a questa origine (0,0).</text><rect fill="#f8fafc" height="350" rx="8" stroke="#e2e8f0" stroke-width="1.5" width="530" x="710" y="96"/><rect fill="#1e293b" height="38" rx="8" width="530" x="710" y="96"/><path d="m710 126h530v8h-530z" fill="#1e293b"/><text fill="#f8fafc" font-size="15" font-weight="700" x="726" y="121">VISTA LATERALE / SEZIONE Z (Profondità vano e spessori)</text><path d="m980 155h20v210h-20z" fill="url(#g)" stroke="#64748b" stroke-width="1.5"/><path d="m980 155v210" stroke="#475569" stroke-width="2.5"/><text fill="#64748b" font-size="11" font-weight="600" text-anchor="end" x="970" y="150">Parete fondo vano</text><path d="m812 165h168v190h-168z" fill="#ecfdf5" opacity=".7" stroke="#10b981" stroke-dasharray="4 4"/><path d="m790 165h22v190h-22z" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><path d="m790 235h22v50h-22z" fill="#fff" stroke="#334155" stroke-dasharray="3 2"/><path d="m730 240h55v40h-55" fill="none" stroke="#d97706" stroke-width="2.5"/><text fill="#d97706" font-size="11" font-weight="700" x="730" y="232">Bocchettone</text><path d="m785 243h18v34h-18z" fill="#fef3c7" stroke="#d97706" stroke-dasharray="3 2" stroke-width="1.5"/><path d="m790 298h13" marker-end="url(#a)" stroke="#d97706" stroke-width="1.8"/><rect fill="#d97706" height="22" rx="4" width="98" x="735" y="302"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="784" y="317">O: INLET_DEPTH</text><path d="m780 155v220" opacity=".6" stroke="#dc2626" stroke-dasharray="4 3" stroke-width="1.2"/><path d="m790 190h100" marker-end="url(#c)" stroke="#dc2626" stroke-width="2"/><text fill="#dc2626" font-size="11" font-weight="700" x="792" y="182">Z=0 (Piatto/Motore)</text><text fill="#dc2626" font-size="12" font-weight="700" x="895" y="194">+Z (verso sacchetto)</text><path d="m790 355v45" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m812 355v45" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m784 390h34" stroke="#0284c7" stroke-width="1.6"/><rect fill="#0284c7" height="22" rx="4" width="86" x="758" y="405"/><text fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle" x="801" y="420">C: PLATE_T</text><path d="m812 215v40" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m980 215v40" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.2"/><path d="m820 225h152" marker-end="url(#d)" marker-start="url(#b)" stroke="#059669" stroke-width="2.5"/><rect fill="#059669" height="26" rx="4" width="124" x="835" y="212"/><text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="897" y="230">P: DEPTH_FREE</text><rect fill="#fef2f2" height="42" rx="4" stroke="#ef4444" stroke-width="1.5" width="135" x="830" y="250"/><text fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle" x="897" y="267">CANCELLO P</text><text fill="#b91c1c" font-size="10.5" font-weight="600" text-anchor="middle" x="897" y="282">Se P &lt; 20 mm → STOP!</text><rect fill="#f8fafc" height="440" rx="8" stroke="#e2e8f0" stroke-width="1.5" width="530" x="710" y="460"/><rect fill="#1e293b" height="38" rx="8" width="530" x="710" y="460"/><path d="m710 490h530v8h-530z" fill="#1e293b"/><text fill="#f8fafc" font-size="15" font-weight="700" x="726" y="485">LEGENDA QUOTE E CANCELLI DECISIONALI</text><g font-size="11.5" transform="translate(725 510)"><text fill="#0f172a" font-weight="700" y="16">Quote sagoma piastra (mm):</text><g fill="#334155"><text y="34"><tspan fill="#0284c7" font-weight="700">A1, A2, A3</tspan> = Largh. sup./inf., angolo</text><text y="50"><tspan fill="#0284c7" font-weight="700">B</tspan> = Altezza corpo senza alette (<tspan font-family="monospace">PLATE_H</tspan>)</text><text y="66"><tspan fill="#0284c7" font-weight="700">C</tspan> = Spessore cartoncino (<tspan font-family="monospace">PLATE_T</tspan>)</text><text y="82"><tspan fill="#0284c7" font-weight="700">D</tspan> = Larghezza scanalatura U (<tspan font-family="monospace">U_W</tspan>)</text><text y="98"><tspan fill="#0284c7" font-weight="700">E</tspan> = Profondità U da bordo sup. (<tspan font-family="monospace">U_DEPTH</tspan>)</text><text y="114"><tspan fill="#0284c7" font-weight="700">F</tspan> = Larghezza aletta (<tspan font-family="monospace">TAB_W</tspan>)</text><text y="130"><tspan fill="#0284c7" font-weight="700">G</tspan> = Altezza aletta sopra bordo (<tspan font-family="monospace">TAB_H</tspan>)</text><text y="146"><tspan fill="#0284c7" font-weight="700">H</tspan> = Rientro bordo-aletta (<tspan font-family="monospace">TAB_X_INSET</tspan>)</text></g><text fill="#0f172a" font-weight="700" x="260" y="16">Foro, tenuta e sacchetto:</text><text fill="#334155" x="260" y="34"><tspan fill="#0284c7" font-weight="700">K</tspan> = Diametro foro piastra (<tspan font-family="monospace">HOLE_D</tspan>)</text><text fill="#334155" x="260" y="50"><tspan fill="#0284c7" font-weight="700">L, M</tspan> = Centro foro da sx e basso (<tspan font-family="monospace">HOLE_X, Y</tspan>)</text><text fill="#334155" x="260" y="66"><tspan fill="#d97706" font-weight="700">N</tspan> = Diametro est. bocchettone (<tspan font-family="monospace">INLET_D</tspan>)</text><text fill="#334155" x="260" y="82"><tspan fill="#d97706" font-weight="700">O</tspan> = Entrata bocchettone (sì/no, mm)</text><text fill="#334155" x="260" y="98"><tspan fill="#059669" font-weight="700">P</tspan> = Spazio libero dietro (<tspan font-family="monospace">DEPTH_FREE</tspan>)</text><text fill="#334155" x="260" y="114"><tspan fill="#059669" font-weight="700">Q</tspan> = Keep-out clip/blocco (<tspan font-family="monospace">KEEPOUTS</tspan>)</text><text fill="#334155" x="260" y="130"><tspan fill="#7c3aed" font-weight="700">T, U</tspan> = Membrana originale: OD, spessore</text><text fill="#334155" x="260" y="146"><tspan fill="#334155" font-weight="700">V</tspan> = Spessore carta 4 strati (<tspan font-family="monospace">PAPER_STACK</tspan>)</text><text fill="#334155" x="260" y="162"><tspan fill="#334155" font-weight="700">W</tspan> = Spessore espanso adesivo (<tspan font-family="monospace">FOAM_T</tspan>)</text></g><g transform="translate(725 695)"><rect fill="#fef2f2" height="54" rx="5" stroke="#ef4444" stroke-width="1.2" width="500"/><text fill="#991b1b" font-size="12" font-weight="700" x="12" y="20">🛑 CANCELLO P (Profondità Vano — DEPTH_FREE):</text><text fill="#7f1d1d" font-size="11" x="12" y="38">Misurare con calibro di profondità. Se P &lt; 20 mm: STOP IMMEDIATO prima del CAD.</text><rect fill="#fffbeb" height="54" rx="5" stroke="#f59e0b" stroke-width="1.2" width="500" y="62"/><text fill="#92400e" font-size="12" font-weight="700" x="12" y="82">⚠️ CANCELLO O (Penetrazione Bocchettone — INLET_ENTERS):</text><text fill="#78350f" font-size="11" x="12" y="100">Se entra nel foro: definire quota penetrazione prima del Task 3 per recesso nel manicotto.</text><rect fill="#eff6ff" height="54" rx="5" stroke="#3b82f6" stroke-width="1.2" width="500" y="124"/><text fill="#1e40af" font-size="12" font-weight="700" x="12" y="144">ℹ️ CANCELLO S (Linguetta di Sicurezza — INTERLOCK_PUSH):</text><text fill="#1e3a8a" font-size="11" x="12" y="162">Se la piastra deve premere la linguetta per chiudere il coperchio: definire battuta e corsa.</text></g></svg>